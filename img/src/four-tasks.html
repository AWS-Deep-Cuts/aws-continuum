<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- four-tasks: 脆弱性への対応で必要な 4 つの作業（記事「そもそも脆弱性の検証とは？」の表の直後）。
     4 つの箱の題と説明は、記事の表の「作業」と「何をするか」の列を、箱に入る長さに縮めたもの。
       見つける: 警告を確認し、コードを読んで、危険な書き方を探す
       検証する: アプリを動かし、攻撃の入力を送って、悪用できるかを確かめる
       優先度を付ける: 攻撃者が届くかと、影響の広がりで、急ぐ順を決める
       修正する: コードを修正し、テストで動作が変わらないことを確かめる
     4 つの作業の順は、API リファレンスの冒頭の説明「コードの脆弱性を見つけ、検証し、優先度を付け、修正する」と同じ（factsheet continuum-002）。
     強調: 検証の箱だけ差し色。記事の「検証には、多くの場合、アプリを動かせる環境を用意し、攻撃の入力を作成して実際に送る作業が必要」
     「特に検証は…最も手間のかかる作業」（筆者の考え）と一致させる。
     下の段の件数（候補 12 件 → 本物 3 件 → 急ぐもの 1 件 → 修正 1 件）は説明用の例。記事は「下の段の件数は…説明用の例です」と書いている。
     「候補」と書き「警告」と書かないのは、npm の警告を AWS Continuum が扱うと読めないようにするため（DESIGN-r1-cv.md §6.2 の 1）。
     アイコンは使わない（AWS の話の前の章のため）。線はすべて水平。 -->
<link rel="stylesheet" href="diagram.css">
<link rel="stylesheet" href="deepcuts.css">
<script src="wires.js"></script>
<style>
  #fig { width: 800px; height: 336px; }
  .st { width: 170px; height: 172px; padding: 8px 12px; }
  .st > b { font-size: 19px; white-space: nowrap; }
  .st > span { white-space: nowrap; line-height: 1.45; }
  .chip { font-family: var(--font-body); font-weight: 900; font-size: 16px; letter-spacing: 0; padding: 3px 12px; white-space: nowrap; }
  .lbl.ink { color: var(--ink); }
</style>
</head><body>
<div id="fig">
  <svg id="wires"></svg>

  <div class="rowl" style="left:0;top:0">脆弱性への対応で必要な 4 つの作業</div>

  <!-- 箱は幅 170、間隔 40。中心の x は 85・295・505・715 -->
  <div class="st" id="t1" data-self="1" style="left:0;top:44px"><i>1</i><b>見つける</b><span>警告を確認し、<br>コードを読んで、<br>危険な書き方を<br>探す</span></div>
  <div class="st hot" id="t2" data-self="1" style="left:210px;top:44px"><i>2</i><b>検証する</b><span>アプリを動かし、<br>攻撃の入力を送り、<br>悪用できるかを<br>確かめる</span></div>
  <div class="st" id="t3" data-self="1" style="left:420px;top:44px"><i>3</i><b>優先度を付ける</b><span>攻撃者が届くかと、<br>影響の広がりで、<br>急ぐ順を決める</span></div>
  <div class="st" id="t4" data-self="1" style="left:630px;top:44px"><i>4</i><b>修正する</b><span>コードを修正し、<br>テストで動作が<br>変わらないことを<br>確かめる</span></div>

  <!-- 下の段: 説明用の件数。札の中心を箱の中心の真下にそろえる -->
  <div class="lbl ink" style="left:24px;top:240px">説明用の例</div>
  <div class="chip line" id="c1" data-self="1" style="top:280px">候補 12 件</div>
  <div class="chip line" id="c2" data-self="1" style="top:280px">本物 3 件</div>
  <div class="chip line" id="c3" data-self="1" style="top:280px">急ぐもの 1 件</div>
  <div class="chip line" id="c4" data-self="1" style="top:280px">修正 1 件</div>
</div>
<script>
window.addEventListener('load', async () => { await document.fonts.ready;
  // 札を箱の中心の真下に置く
  [['#c1', 85], ['#c2', 295], ['#c3', 505], ['#c4', 715]].forEach(([s, cx]) => {
    const e = document.querySelector(s); e.style.left = (cx - e.offsetWidth / 2) + 'px';
  });
  const first = document.querySelector('#c1');
  document.querySelector('.lbl').style.left = first.offsetLeft + 'px';
  wire('#t1', '#t2', {}); wire('#t2', '#t3', {}); wire('#t3', '#t4', {});
  wire('#c1', '#c2', {}); wire('#c2', '#c3', {}); wire('#c3', '#c4', {});
  document.body.dataset.ready = '1';
});
</script>
</body></html>
